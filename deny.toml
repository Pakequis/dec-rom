# License policy: only permissive licenses, for every dependency, direct or
# transitive. Enforced in CI by `cargo deny check licenses` (see
# .github/workflows/release.yml).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Licenses of the fonts egui embeds (epaint_default_fonts), not of code.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
